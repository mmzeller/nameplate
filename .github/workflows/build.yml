name: Build Nameplate

# Every push to main is compiled on a Mac, so a broken build shows up here before it's installed.
# When the version in Sources/NameplateCore/Models.swift changes to a number that hasn't been
# released yet, the build is published as a GitHub release (tag v<version>) with
# Nameplate.zip (used by install.sh) and Nameplate.dmg (for installing by hand).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Show the tools
        run: |
          sw_vers
          xcrun swiftc --version

      - name: Build for Apple silicon and Intel
        id: build
        shell: bash
        run: |
          set -o pipefail
          bash build.sh --no-install --universal 2>&1 | tee build.log

      - name: Point at compile errors
        if: failure()
        shell: bash
        run: |
          grep -E '^[^ ]+\.swift:[0-9]+:[0-9]+: error: ' build.log | sort -u | head -10 | while IFS= read -r line; do
            file=$(printf '%s' "$line" | cut -d: -f1)
            row=$(printf '%s' "$line" | cut -d: -f2)
            col=$(printf '%s' "$line" | cut -d: -f3)
            msg=$(printf '%s' "$line" | cut -d: -f5- | sed -e 's/^ //' -e 's/%/%25/g')
            echo "::error file=${file#"$GITHUB_WORKSPACE/"},line=$row,col=$col::$msg"
          done

      - name: Run the tests (memory, Mach ports, file handles, command timeouts)
        id: test
        shell: bash
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log

      - name: Check the command-line tool
        id: check
        shell: bash
        run: |
          set -o pipefail
          {
            lipo -info build/Nameplate.app/Contents/MacOS/Nameplate
            build/Nameplate.app/Contents/Helpers/nameplate --version
            build/Nameplate.app/Contents/Helpers/nameplate --live
            build/Nameplate.app/Contents/Helpers/nameplate --keys
            build/Nameplate.app/Contents/Helpers/nameplate --json > /dev/null
            build/Nameplate.app/Contents/Helpers/nameplate --get model --get cpu
          } 2>&1 | tee check.log

      - name: Start the app and make sure it keeps running
        id: launch
        shell: bash
        run: |
          build/Nameplate.app/Contents/MacOS/Nameplate > launch.log 2>&1 &
          pid=$!
          sleep 15
          if kill -0 "$pid" 2>/dev/null; then
            echo "Nameplate is running after 15 seconds." | tee -a launch.log
            kill "$pid" || true
          else
            code=0
            wait "$pid" || code=$?
            echo "Nameplate stopped with exit code $code." | tee -a launch.log
            ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i nameplate | head -1 | while read -r report; do
              head -120 ~/Library/Logs/DiagnosticReports/"$report" >> launch.log
            done
            exit 1
          fi

      - name: Run the app busy for four minutes and look for leaks
        id: leaks
        continue-on-error: true
        shell: bash
        run: |
          # Turn on everything that runs repeatedly: every item, live numbers each second,
          # a command every 5 seconds, a frosted background, and live text in the menu bar.
          python3 - > layout.json <<'PY'
          import json, uuid
          def entry(kind, **extra):
              e = {"id": str(uuid.uuid4()).upper(), "kind": kind, "enabled": True, "text": "", "interval": 60}
              e.update(extra)
              return e
          top = ["computerName", "hostName", "model", "modelIdentifier", "serialNumber", "hardwareUUID", "chip",
                 "memory", "graphics", "os", "server", "user", "uptime", "bootTime", "cpuUsage", "memoryUsage",
                 "battery", "batteryHealth", "disks", "interfaces", "networkSpeed"]
          details = ["wifiName", "ipv4", "subnetMask", "router", "configMethod", "ipv6", "macAddress", "dns",
                     "searchDomains", "wifiSignal"]
          entries = [entry("heading", text="Test {time}")] + [entry("item", item=i) for i in top]
          entries += [entry("spacer"),
                      entry("text", label="Live", text="{cpu} · {memory-used} · down {down} up {up}"),
                      entry("command", label="Cmd", text="date +%s; echo second line", interval=5)]
          print(json.dumps({"entries": entries, "interfaceDetails": [entry("item", item=d) for d in details]}))
          PY
          domain=com.mmzeller.Nameplate
          defaults write $domain Layout -string "$(cat layout.json)"
          defaults write $domain LiveInterval -float 1
          defaults write $domain Background -string blur
          defaults write $domain MenuBarText -string custom
          defaults write $domain MenuBarTemplate -string "{cpu} down {down}"
          defaults delete $domain HasLaunchedBefore 2>/dev/null || true

          build/Nameplate.app/Contents/MacOS/Nameplate > app.log 2>&1 &
          pid=$!
          sleep 45
          early=0; sudo leaks "$pid" > leaks-early.txt 2>&1 || early=$?
          : > rss.txt
          for i in $(seq 1 12); do
            sleep 15
            echo "$((45 + i * 15)) s: $(ps -o rss= -p "$pid" | tr -d ' ') KB" >> rss.txt
          done
          late=0; sudo leaks "$pid" > leaks-late.txt 2>&1 || late=$?
          running=no; kill -0 "$pid" 2>/dev/null && running=yes
          kill "$pid" 2>/dev/null || true
          {
            echo "still running after 4 minutes: $running"
            echo "== after 45 seconds (leaks exit $early)"
            grep -E "Physical footprint|leaks for|Process [0-9]+:" leaks-early.txt || head -20 leaks-early.txt
            echo "== after 4 minutes (leaks exit $late)"
            grep -E "Physical footprint|leaks for|Process [0-9]+:" leaks-late.txt || head -20 leaks-late.txt
            echo "== resident memory every 15 seconds"
            cat rss.txt
            echo "== details of anything leaked (after 4 minutes)"
            sed -n '/leaks for/,$p' leaks-late.txt | head -200
          } > leaks.log
          cat leaks.log
          [ "$running" = yes ] && [ "$late" = 0 ]

      - name: Package the app
        shell: bash
        run: |
          cd build
          ditto -c -k --keepParent Nameplate.app Nameplate.zip
          mkdir -p dmg
          ditto Nameplate.app dmg/Nameplate.app
          ln -s /Applications dmg/Applications
          for attempt in 1 2 3; do
            hdiutil create -volname Nameplate -srcfolder dmg -ov -format UDZO Nameplate.dmg && break
            sleep 5
          done
          test -f Nameplate.dmg
          shasum -a 256 Nameplate.zip Nameplate.dmg

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: Nameplate
          path: |
            build/Nameplate.zip
            build/Nameplate.dmg

      - name: Read the version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/.*static let version = "\(.*\)".*/\1/p' Sources/NameplateCore/Models.swift)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "v$version is already released; nothing to publish."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish a release for a new version
        if: github.ref == 'refs/heads/main' && steps.version.outputs.released == 'false' && steps.launch.outcome == 'success' && steps.test.outcome == 'success'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Nameplate ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: .github/release-notes.md
          files: |
            build/Nameplate.zip
            build/Nameplate.dmg
          fail_on_unmatched_files: true
          make_latest: true

      - name: Attach to a release tagged by hand
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: .github/release-notes.md
          files: |
            build/Nameplate.zip
            build/Nameplate.dmg

      # Leaves the results on the build-status branch, so they can be read with plain git.
      - name: Save the build result
        if: always()
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/build-status"
          rm -rf "$out" && mkdir -p "$out" && cd "$out"
          git init -q
          {
            echo "commit: $GITHUB_SHA"
            echo "job: ${{ job.status }}"
            echo "build: ${{ steps.build.outcome }}"
            echo "test: ${{ steps.test.outcome }}"
            echo "check: ${{ steps.check.outcome }}"
            echo "launch: ${{ steps.launch.outcome }}"
            echo "leaks: ${{ steps.leaks.outcome }}"
          } > status.txt
          for f in build.log test.log check.log launch.log leaks.log app.log; do
            if [ -f "$GITHUB_WORKSPACE/$f" ]; then cp "$GITHUB_WORKSPACE/$f" .; fi
          done
          if [ -f build.log ]; then grep -E 'error:|warning:' build.log | sort -u > problems.txt || true; fi
          git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "Build result for $GITHUB_SHA"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/build-status
