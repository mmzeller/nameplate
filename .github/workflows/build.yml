name: Build Nameplate

# Every push to main is compiled on a Mac, so a broken build shows up here before it's installed.
# When the version in Sources/NameplateCore/Models.swift changes to a number that hasn't been
# released yet, the build is published as a GitHub release (tag v<version>) with
# Nameplate.zip (used by install.sh) and Nameplate.dmg (for installing by hand).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Show the tools
        run: |
          sw_vers
          xcrun swiftc --version

      - name: Build for Apple silicon and Intel
        shell: bash
        run: |
          set -o pipefail
          bash build.sh --no-install --universal 2>&1 | tee build.log

      - name: Point at compile errors
        if: failure()
        shell: bash
        run: |
          grep -E '^[^ ]+\.swift:[0-9]+:[0-9]+: error: ' build.log | sort -u | head -10 | while IFS= read -r line; do
            file=$(printf '%s' "$line" | cut -d: -f1)
            row=$(printf '%s' "$line" | cut -d: -f2)
            col=$(printf '%s' "$line" | cut -d: -f3)
            msg=$(printf '%s' "$line" | cut -d: -f5- | sed -e 's/^ //' -e 's/%/%25/g')
            echo "::error file=${file#"$GITHUB_WORKSPACE/"},line=$row,col=$col::$msg"
          done

      - name: Check the app
        run: |
          lipo -info build/Nameplate.app/Contents/MacOS/Nameplate
          build/Nameplate.app/Contents/Helpers/nameplate --version
          build/Nameplate.app/Contents/Helpers/nameplate
          build/Nameplate.app/Contents/Helpers/nameplate --json > /dev/null

      - name: Package the app
        shell: bash
        run: |
          cd build
          ditto -c -k --keepParent Nameplate.app Nameplate.zip
          mkdir -p dmg
          ditto Nameplate.app dmg/Nameplate.app
          ln -s /Applications dmg/Applications
          for attempt in 1 2 3; do
            hdiutil create -volname Nameplate -srcfolder dmg -ov -format UDZO Nameplate.dmg && break
            sleep 5
          done
          test -f Nameplate.dmg
          shasum -a 256 Nameplate.zip Nameplate.dmg

      - uses: actions/upload-artifact@v6
        with:
          name: Nameplate
          path: |
            build/Nameplate.zip
            build/Nameplate.dmg

      - name: Read the version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/.*static let version = "\(.*\)".*/\1/p' Sources/NameplateCore/Models.swift)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "v$version is already released; nothing to publish."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish a release for a new version
        if: github.ref == 'refs/heads/main' && steps.version.outputs.released == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Nameplate ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: .github/release-notes.md
          files: |
            build/Nameplate.zip
            build/Nameplate.dmg
          fail_on_unmatched_files: true
          make_latest: true

      - name: Attach to a release tagged by hand
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          body_path: .github/release-notes.md
          files: |
            build/Nameplate.zip
            build/Nameplate.dmg
